name: Pamplejuce

on:
  workflow_dispatch: # lets you run a build from the UI
  workflow_call: # lets other workflows call this one
  push:
  pull_request:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  IPP_DIR: C:\Program Files (x86)\Intel\oneAPI\ipp\latest\lib\cmake\ipp

defaults:
  run:
    shell: bash

# jobs are run in parallel on different machines
# all steps run in series
jobs:
  build_and_test:
    # don't double run on PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include:
          - name: macOS
            os: macos-14
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            pluginval-binary: ./pluginval.exe
            extra-flags: -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

    steps:
      # Setup MSVC toolchain and developer command prompt (Windows)
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install IPP (Windows)
        if: (runner.os == 'Windows')
        run: |
          nuget install intelipp.static.win-x64 -Version 2026.0.0.712

      - name: Install Ninja (Windows)
        if: (runner.os == 'Windows')
        run: choco install ninja

      - name: Install macOS Deps
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja osxutils

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ matrix.extra-flags }} .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Test & Benchmarks
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --verbose --output-on-failure

      - name: Set additional env vars for next steps
        run: |
          # 1. Hardcode variables from CMakeLists.txt
          PROJECT_NAME="HomeChords"
          PRODUCT_NAME="Home-Chords"
          # 2. Read the version directly from the file!
          VERSION=$(cat VERSION | tr -d '[:space:]')

          # 3. Add them to GITHUB_ENV
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$PRODUCT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # 4. Define paths using the local shell variables
          # Only VST3 + Standalone -- those are the FORMATS this plugin
          # actually builds (see CMakeLists.txt). AU/AUv3/CLAP paths from
          # the Home-Disto/Home-Sidechain version of this file are left
          # out rather than pointing at artifacts that don't exist.
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${PROJECT_NAME}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "VST3_PATH=$ARTIFACTS_PATH/VST3/${PRODUCT_NAME}.vst3" >> $GITHUB_ENV
          echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${PRODUCT_NAME}.app" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${PRODUCT_NAME}-${VERSION}-${{ runner.os }}" >> $GITHUB_ENV

      - name: Pluginval
        run: |
          curl -LO "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_${{ runner.os }}.zip"
          7z x pluginval_${{ runner.os }}.zip
          ${{ matrix.pluginval-binary }} --strictness-level 10 --verbose --validate "${{ env.VST3_PATH }}"

      # No packaging/ assets exist yet for this plugin (no icon, no Inno
      # Setup script), so unlike Home-Disto/Home-Sidechain this workflow
      # doesn't embed a custom macOS icon or build a Windows installer --
      # it just zips the raw build output for both platforms below. Add
      # packaging/pamplejuce.icns + packaging/installer.iss and bring back
      # the equivalent steps from Home-Disto's build_and_test.yml once
      # those exist.

      # - name: Import Certificates (macOS)
      #   uses: sudara/basic-macos-keychain-action@v1
      #   id: keychain
      #   if: ${{ runner.os == 'macOS'}}
      #   with:
      #     dev-id-app-cert: ${{ secrets.DEV_ID_APP_CERT }}
      #     dev-id-app-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
      #     dev-id-installer-cert: ${{ secrets.DEV_ID_INSTALLER_CERT }}
      #     dev-id-installer-password: ${{ secrets.DEV_ID_INSTALLER_PASSWORD }}

      # - name: Codesign (macOS)
      #   if: ${{ runner.os == 'macOS' }}
      #   timeout-minutes: 5
      #   run: |
      #     # Each plugin must be code signed
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.VST3_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.STANDALONE_PATH }}" --deep --strict --options=runtime --timestamp

      - name: Zip (macOS)
        if: ${{ runner.os == 'macOS' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" .

      - name: Upload Zip (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.zip"

      - name: Zip (Windows)
        if: ${{ runner.os == 'Windows' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" .

      - name: Upload Zip (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.zip"

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          # download-artifact puts these files in their own dirs...
          # Using globs sidesteps having to pass the version around
          files: |
            */*.zip
